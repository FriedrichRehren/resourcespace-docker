name: Deploy Image

# Reusable workflow: builds the image, runs the smoke test (fresh install,
# admin login, dump, restore) and only then pushes to GHCR and/or Docker Hub.
# Callers pass plain tag names (e.g. "11.0-r12345 11.0 latest"); the registry
# prefixes are added here, so image names live in one place.

on:
  workflow_call:
    inputs:
      rs_release:
        description: "ResourceSpace release branch, e.g. 11.0"
        required: true
        type: string
      rs_revision:
        description: "SVN revision of the release branch"
        required: true
        type: string
      version:
        description: "Version recorded in the image metadata, e.g. 11.0-r12345"
        required: true
        type: string
      tags:
        description: "Space- or newline-separated tag names, without registry prefix"
        required: true
        type: string
      push_ghcr:
        description: "Push to GHCR"
        required: false
        default: true
        type: boolean
      push_dockerhub:
        description: "Push to Docker Hub"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: resourcespace
  DOCKERHUB_NAMESPACE: friedrichrehren
  IMAGE_DESCRIPTION: ResourceSpace digital asset management, configured via environment variables
  TEST_IMAGE: resourcespace:smoke-test

jobs:
  test:
    name: Build and Smoke Test (amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: |
            RS_RELEASE=${{ inputs.rs_release }}
            RS_REVISION=${{ inputs.rs_revision }}
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: bash tests/smoke-test.sh "${TEST_IMAGE}"

  deploy:
    name: Build and Push
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve image references
        id: refs
        shell: bash
        env:
          TAGS: ${{ inputs.tags }}
          PUSH_GHCR: ${{ inputs.push_ghcr }}
          PUSH_DOCKERHUB: ${{ inputs.push_dockerhub }}
        run: |
          set -euo pipefail

          read -r -a tags <<< "$(tr '\n' ' ' <<< "${TAGS}")"
          (( ${#tags[@]} > 0 )) || { echo "No tags given" >&2; exit 1; }

          [[ "${PUSH_GHCR}" == "true" || "${PUSH_DOCKERHUB}" == "true" ]] \
            || { echo "No target registry selected" >&2; exit 1; }

          ghcr_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          dockerhub_image="docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}"

          {
            echo "refs<<EOF"
            for tag in "${tags[@]}"; do
              if [[ "${PUSH_GHCR}" == "true" ]]; then echo "${ghcr_image}:${tag}"; fi
              if [[ "${PUSH_DOCKERHUB}" == "true" ]]; then echo "${dockerhub_image}:${tag}"; fi
            done
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: inputs.push_ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.push_dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            RS_RELEASE=${{ inputs.rs_release }}
            RS_REVISION=${{ inputs.rs_revision }}
          tags: ${{ steps.refs.outputs.refs }}
          cache-from: type=gha
          annotations: |
            index:org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}

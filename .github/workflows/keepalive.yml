name: Keep Schedules Alive

# GitHub disables scheduled workflows after 60 days without repository
# activity. Once a week this re-enables every workflow in this repository that
# has a schedule (including this one), which resets the inactivity timer.
# Workflows that were disabled by hand are left alone.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  keepalive:
    name: Re-enable Scheduled Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Re-enable scheduled workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          grep -l -E '^[[:space:]]+schedule:' .github/workflows/*.yml | while read -r file; do
            workflow="$(basename "${file}")"
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq .state)"

            if [[ "${state}" == "disabled_manually" ]]; then
              echo "${workflow}: disabled manually – skipped"
              continue
            fi

            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
            echo "${workflow}: ${state} -> active"
          done

name: Check Upstream Release

# Watches the ResourceSpace SVN release branches and publishes an image when
#  - a new revision of the newest release branch appeared (daily),
#  - the base image should be refreshed for security updates (weekly, forced),
#  - the packaging in this repository changed (push to main, forced),
#  - it is started manually (optionally forced and/or pinned to a release).

on:
  schedule:
    - cron: "17 4 * * *"   # daily upstream check
    - cron: "47 4 * * 1"   # weekly forced rebuild (Ubuntu security updates)
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - rootfs/**
      - tests/**
      - .github/workflows/check-upstream.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      rs_release:
        description: 'ResourceSpace release branch (e.g. 11.0), or "latest"'
        required: true
        default: "latest"
      force:
        description: "Rebuild and push even if the version is already published"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-release
  cancel-in-progress: false

env:
  IMAGE_NAME: resourcespace
  DOCKERHUB_NAMESPACE: friedrichrehren
  SVN_RELEASES: https://svn.resourcespace.com/svn/rs/releases

jobs:
  check:
    name: Check Latest Upstream Revision
    runs-on: ubuntu-latest

    outputs:
      rs_release: ${{ steps.check.outputs.rs_release }}
      rs_revision: ${{ steps.check.outputs.rs_revision }}
      version: ${{ steps.check.outputs.version }}
      tags: ${{ steps.check.outputs.tags }}
      push_ghcr: ${{ steps.check.outputs.push_ghcr }}
      push_dockerhub: ${{ steps.check.outputs.push_dockerhub }}

    steps:
      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Check latest upstream revision
        id: check
        shell: bash
        env:
          INPUT_RELEASE: ${{ inputs.rs_release || vars.RS_RELEASE || 'latest' }}
          FORCE: ${{ (github.event_name == 'push' || github.event.schedule == '47 4 * * 1' || inputs.force) && 'true' || 'false' }}
        run: |
          set -euo pipefail

          ghcr_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          dockerhub_image="docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}"

          newest="$(svn ls "${SVN_RELEASES}/" | sed -n 's#^\([0-9][0-9.]*\)/$#\1#p' | sort -V | tail -n1)"
          if [[ "${INPUT_RELEASE}" == "latest" ]]; then
            release="${newest}"
          else
            release="${INPUT_RELEASE}"
          fi
          [[ -n "${release}" ]] || { echo "No release branch found" >&2; exit 1; }

          revision="$(svn info --show-item last-changed-revision "${SVN_RELEASES}/${release}")"
          version="${release}-r${revision}"

          tags="${version} ${release}"
          if [[ "${release}" == "${newest}" ]]; then tags="${tags} latest"; fi

          missing() { ! docker buildx imagetools inspect "$1" >/dev/null 2>&1; }

          push_ghcr=false
          push_dockerhub=false
          if [[ "${FORCE}" == "true" ]] || missing "${ghcr_image}:${version}"; then push_ghcr=true; fi
          if [[ "${FORCE}" == "true" ]] || missing "${dockerhub_image}:${version}"; then push_dockerhub=true; fi

          echo "Newest release branch: ${newest}"
          echo "Selected release:      ${release}"
          echo "Revision:              ${revision}"
          echo "Tags:                  ${tags}"
          echo "Forced:                ${FORCE}"
          echo "Push to GHCR:          ${push_ghcr}"
          echo "Push to Docker Hub:    ${push_dockerhub}"

          {
            echo "rs_release=${release}"
            echo "rs_revision=${revision}"
            echo "version=${version}"
            echo "tags=${tags}"
            echo "push_ghcr=${push_ghcr}"
            echo "push_dockerhub=${push_dockerhub}"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy Image
    needs: check
    if: needs.check.outputs.push_ghcr == 'true' || needs.check.outputs.push_dockerhub == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      rs_release: ${{ needs.check.outputs.rs_release }}
      rs_revision: ${{ needs.check.outputs.rs_revision }}
      version: ${{ needs.check.outputs.version }}
      tags: ${{ needs.check.outputs.tags }}
      push_ghcr: ${{ needs.check.outputs.push_ghcr == 'true' }}
      push_dockerhub: ${{ needs.check.outputs.push_dockerhub == 'true' }}
    secrets: inherit
